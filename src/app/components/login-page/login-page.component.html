<section class="auth-layout">
  <div class="auth-card">
    <div class="auth-header">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Sign in to Blogspace</h1>
      <p>Access your account and continue sharing your ideas.</p>
    </div>

    <form name="form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          required
          type="text"
          name="username"
          [(ngModel)]="form.username"
          #username="ngModel"
          placeholder="Enter your username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="form.password"
          required
          #password="ngModel"
          placeholder="Enter your password">
      </div>

      <button class="submit-button" type="submit" [disabled]="!f.form.valid">
        Sign In
      </button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="auth-footer">
      No account yet?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</section>
